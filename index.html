<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEATHER APP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=...">
    <link rel="stylesheet" href="style.css">
</head>
<body>
 
    <div class ="wrapper">
        <h1>Weather App</h1>
        <div class="tab-container">
            <p class="tab" data-userWeather>Your Weather</p>
            <p class="tab" data-searchWeather>Search Weather</p>
        </div>
        <div class="weather-container">
        <!---------grant location container------->
        <div class="sub-container grant-location-container">
            <img src="./location.png" width="80" height="80" loading="lazy">
            <p>Grant Location Access</p>
            <p>Allow Access to get weather Information</p>
            <button class="btn" data-grantAccess>Grant Access</button>
        </div>

        <!--------search from--> <!--form-container---->
        <form class="form-container" data-searchForm>
        <input placeholder="Search for city..." data-searchInput>
        <button class="btn" type="submit">
            <img src="./search copy.png" width="20" height="20" loading ="lazy">
        </button>
        </form>

        <!------loading screen container----->
        <div class="sub-container loading-container">
            <img src="./loading.gif" width="70" height="70">
            <p>Loading</p>
        </div>
    

        <!---show weather information-->
        <div class="user-info-container">

            <!--city name and flag-->
            <div class="name">
                <p data-cityName></p>
                    <img data-countryIcon>
            </div>
            <img data-weatherIcon>
            <p data-weatherDesc></p>
            <p data-temp></p>

            <!--3 cards parameters-->
            <div class="parameter-container">

                <!--card 1-->
                 <div class="parameter">
                <img src="./windspeed.png" width="80" height="80">
                <p>windspeed</p>
                <p data-windspeed></p>
                </div>

                <!--card 2-->
                <div class="parameter">
                <img src="./humidity.png"  width="80" height="80">
                <p>humidity</p>
                <p data-humidity></p>
                </div>

                <!---card 3-->
                <div class="parameter">
                    <img src="./clouds.png"  width="80" height="80">
                    <p>clouds</p>
                    <p data-cloudiness></p>
                </div>
            </div>
        </div>

    </div>
    </div>
<script src="script.js"></script>
</body>
</html>
